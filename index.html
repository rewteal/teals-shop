<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teal's Shop - Steal a Brainrot Pets</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF70A6;
            --secondary: #70D6FF;
            --accent: #FFD166;
            --dark: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --light: #F7FFF7;
            --purple: #9B5DE5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: var(--light);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .cart-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn span {
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge-secret {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #FF70A6, var(--purple));
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            z-index: 2;
        }

        .card-img-container {
            width: 100%;
            height: 220px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .card-img-container svg {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--light);
        }

        .price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .buy-btn {
            background: linear-gradient(135deg, var(--secondary), var(--purple));
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(112, 214, 255, 0.3);
        }

        .payment-section {
            margin-top: 40px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .payment-section h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .payment-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Teal's Shop</h1>
        <div class="cart-btn">
            🛒 Səbət <span>0</span>
        </div>
    </header>

    <div class="container">
        <div class="grid">
            <!-- Dragon Cannelloni (Yenilənmiş Qırmızı Versiya) -->
            <div class="card">
                <div class="badge-secret">SECRET</div>
                <div class="card-img-container">
                    <svg viewBox="0 0 200 200" width="160" height="160">
                        <defs>
                            <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FF5252" />
                                <stop offset="100%" stop-color="#C62828" />
                            </linearGradient>
                            <linearGradient id="dragonWing" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFD166" />
                                <stop offset="100%" stop-color="#F57C00" />
                            </linearGradient>
                        </defs>
                        <!-- Qanadlar -->
                        <path d="M65,95 Q20,60 30,35 Q65,60 75,85 Z" fill="url(#dragonWing)" />
                        <path d="M135,95 Q180,60 170,35 Q135,60 125,85 Z" fill="url(#dragonWing)" />
                        <!-- Bədən -->
                        <ellipse cx="100" cy="115" rx="42" ry="48" fill="url(#dragonBody)" />
                        <!-- Baş -->
                        <circle cx="100" cy="68" r="30" fill="url(#dragonBody)" />
                        <!-- Buynuzlar -->
                        <polygon points="82,45 73,22 90,40" fill="#FFD166" />
                        <polygon points="118,45 127,22 110,40" fill="#FFD166" />
                        <!-- Gözlər -->
                        <circle cx="89" cy="64" r="5" fill="#FFFFFF" />
                        <circle cx="89" cy="64" r="2" fill="#000000" />
                        <circle cx="111" cy="64" r="5" fill="#FFFFFF" />
                        <circle cx="111" cy="64" r="2" fill="#000000" />
                        <!-- Burun -->
                        <ellipse cx="100" cy="76" rx="7" ry="4" fill="#8E0000" />
                        <!-- Qarın -->
                        <ellipse cx="100" cy="120" rx="22" ry="28" fill="#FFCDD2" opacity="0.5" />
                    </svg>
                </div>
                <div class="card-content">
                    <div>
                        <div class="card-title">Dragon Cannelloni</div>
                        <div class="price">16.00 AZN</div>
                    </div>
                    <button class="buy-btn">🛒 Səbətə Əlavə Et</button>
                </div>
            </div>
        </div>

        <div class="payment-section">
            <h3>💳 Ödəniş Üsulları</h3>
            <ul class="payment-list">
                <li>✔ M10</li>
                <li>✔ eManat</li>
                <li>✔ BirBank / Leobank (Kart)</li>
            </ul>
        </div>
    </div>

</body>
</html>
